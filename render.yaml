services:
  - type: web
    name: stream-backend
    env: docker
    dockerfilePath: Backend/Dockerfile
    dockerContext: Backend
    plan: free
    region: frankfurt
    envVars:
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard (Paste your existing Render DB or Neon/Supabase URL)
      - key: JWT_SECRET
        generateValue: true
      - key: QR_SECRET
        generateValue: true
      - key: MAIL_HOST
        value: "smtp.gmail.com"
      - key: SMTP_USERNAME
        sync: false # Set in Render Dashboard
      - key: SMTP_PASSWORD
        sync: false # Set in Render Dashboard
